# ==============================================================================
# SMITHERY MCP REGISTRY CONFIGURATION
# Package: @asepsepep/warungjovalga-mcp
# Gateway: https://warungjovalga.shop
# Protocol: Model Context Protocol (MCP) & HTTP 402 Base L2 (USDC Native)
# ==============================================================================

name: warungjovalga-mcp
version: 1.0.0
description: Official Model Context Protocol (MCP) server and LangChain integration for deterministic data cleaning, AST code analysis, and binary Parquet conversion.
repository: https://github.com/asepsepep/warungjovalga-mcp
homepage: https://warungjovalga.shop

startCommand:
  type: stdio
  config:
    command: python
    args:
      - "-m"
      - "warungjovalga_mcp"

tools:
  - name: clean_regex
    description: High-velocity deterministic regex sanitization and HTML stripping (<50ms).
    inputSchema:
      type: object
      properties:
        payload:
          type: string
          description: Raw scraped text or HTML string to sanitize.
        tx_hash:
          type: string
          description: Base L2 USDC micropayment transaction receipt hash.
      required:
        - payload

  - name: repair_json
    description: Deterministic JSON syntax recovery from malformed LLM outputs.
    inputSchema:
      type: object
      properties:
        payload:
          type: string
          description: Broken JSON string.
        tx_hash:
          type: string
          description: Base L2 USDC micropayment transaction receipt hash.
      required:
        - payload

  - name: csv_to_parquet
    description: High-velocity conversion of CSV text chunks to Apache Parquet binary format.
    inputSchema:
      type: object
      properties:
        payload:
          type: string
          description: Raw CSV string.
        tx_hash:
          type: string
          description: Base L2 USDC micropayment transaction receipt hash.
      required:
        - payload
